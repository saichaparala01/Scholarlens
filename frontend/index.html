<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScholarLens</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1c2430; --muted: #5b6675;
    --line: #dde2ea; --accent: #2457d6; --accent-text: #ffffff; --chip: #e8eefc; --warn: #8a5a00;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12161c; --card: #1a2029; --text: #e7ebf1; --muted: #9aa6b6;
            --line: #2b3441; --accent: #6b95ff; --accent-text: #0d1320; --chip: #243049; --warn: #e0b45a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  h2 { font-size: 1rem; margin: 0 0 10px; }
  textarea, input[type=text] { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px;
         background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 300px; resize: vertical; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  button { border: 0; border-radius: 8px; padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer;
           background: var(--accent); color: var(--accent-text); }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button:disabled { opacity: .5; cursor: wait; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
  .tab { background: none; color: var(--muted); border-radius: 0; padding: 8px 12px; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .panel { display: none; } .panel.active { display: block; }
  .out { white-space: pre-wrap; min-height: 80px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 3px 10px; font-size: .88rem; }
  .chip small { color: var(--muted); }
  .label { font-weight: 600; margin-top: 8px; }
  .muted { color: var(--muted); font-size: .9rem; }
  .evidence { border-left: 3px solid var(--accent); padding-left: 10px; color: var(--muted); margin-top: 8px; }
  .error { color: #c0392b; } .warn { color: var(--warn); }
  #status { font-size: .85rem; color: var(--muted); margin-top: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ScholarLens</h1>
  <p class="sub">Summarize a research paper, pull out its key entities, and ask it questions.</p>

  <div class="grid">
    <section class="card">
      <h2>1. Paste or upload a paper</h2>
      <textarea id="paper" placeholder="Paste the paper text here (abstract, sections, or the full text)..."></textarea>
      <div class="row">
        <input type="file" id="file" accept=".pdf,.txt">
        <button class="secondary" id="clear">Clear</button>
        <span class="muted" id="count">0 words</span>
      </div>
    </section>

    <section class="card">
      <h2>2. Choose what to do</h2>
      <div class="tabs">
        <button class="tab active" data-tab="summary">Summary</button>
        <button class="tab" data-tab="entities">Entities</button>
        <button class="tab" data-tab="qa">Ask</button>
      </div>

      <div class="panel active" id="panel-summary">
        <button id="run-summary">Summarize paper</button>
        <div class="out" id="out-summary"></div>
      </div>

      <div class="panel" id="panel-entities">
        <button id="run-entities">Extract entities</button>
        <div id="out-entities"></div>
      </div>

      <div class="panel" id="panel-qa">
        <input type="text" id="question" placeholder="e.g. Which dataset was used for evaluation?">
        <div class="row"><button id="run-qa">Ask</button></div>
        <div id="out-qa"></div>
      </div>
    </section>
  </div>
  <div id="status"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const paper = $("paper");

paper.addEventListener("input", () => {
  $("count").textContent = (paper.value.trim() ? paper.value.trim().split(/\s+/).length : 0) + " words";
});
$("clear").onclick = () => { paper.value = ""; paper.dispatchEvent(new Event("input")); };

document.querySelectorAll(".tab").forEach((tab) => tab.onclick = () => {
  document.querySelectorAll(".tab, .panel").forEach((el) => el.classList.remove("active"));
  tab.classList.add("active");
  $("panel-" + tab.dataset.tab).classList.add("active");
});

async function api(path, body, button, out) {
  if (!paper.value.trim()) { out.innerHTML = '<p class="error">Paste some paper text first.</p>'; return null; }
  button.disabled = true; out.innerHTML = '<p class="muted">Working... the first request loads the model and can take a minute.</p>';
  try {
    const res = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail ? JSON.stringify(data.detail) : res.statusText);
    refreshStatus();
    return data;
  } catch (err) {
    out.innerHTML = '<p class="error">' + escapeHtml(err.message) + '</p>';
    return null;
  } finally { button.disabled = false; }
}

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

$("run-summary").onclick = async () => {
  const data = await api("/api/summarize", { text: paper.value }, $("run-summary"), $("out-summary"));
  if (data) $("out-summary").innerHTML = "<p>" + escapeHtml(data.summary || data.note || "") + "</p>" +
    '<p class="muted">Summarized ' + data.chunks + " section(s) of the paper.</p>";
};

$("run-entities").onclick = async () => {
  const data = await api("/api/entities", { text: paper.value }, $("run-entities"), $("out-entities"));
  if (!data) return;
  if (!data.entities.length) { $("out-entities").innerHTML = '<p class="muted">No entities found.</p>'; return; }
  const groups = {};
  data.entities.forEach((e) => (groups[e.label] = groups[e.label] || []).push(e));
  $("out-entities").innerHTML = Object.entries(groups).map(([label, list]) =>
    '<div class="label">' + escapeHtml(label) + '</div><div class="chips">' +
    list.slice(0, 30).map((e) => '<span class="chip">' + escapeHtml(e.text) + " <small>x" + e.count + "</small></span>").join("") +
    "</div>").join("");
};

$("run-qa").onclick = async () => {
  const q = $("question").value.trim();
  if (q.length < 3) { $("out-qa").innerHTML = '<p class="error">Type a question first.</p>'; return; }
  const data = await api("/api/ask", { text: paper.value, question: q }, $("run-qa"), $("out-qa"));
  if (!data) return;
  const answer = data.answer ? "<p><strong>" + escapeHtml(data.answer) + "</strong> <span class='muted'>(confidence " +
      Math.round(data.confidence * 100) + "%)</span></p>" : '<p class="warn">' + escapeHtml(data.note || "No answer found.") + "</p>";
  $("out-qa").innerHTML = answer + (data.evidence ? '<div class="evidence">' + escapeHtml(data.evidence) + "</div>" : "");
};

$("file").onchange = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  const form = new FormData(); form.append("file", file);
  $("count").textContent = "Reading file...";
  try {
    const res = await fetch("/api/extract", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || res.statusText);
    paper.value = data.text; paper.dispatchEvent(new Event("input"));
  } catch (err) { $("count").textContent = "Could not read file: " + err.message; }
};

async function refreshStatus() {
  try {
    const m = (await (await fetch("/api/health")).json()).models;
    $("status").textContent = "Models: " + Object.entries(m).map(([k, v]) => k + " = " + v).join(" | ");
  } catch (_) {}
}
refreshStatus();
</script>
</body>
</html>
